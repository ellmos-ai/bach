name: githubbot-hold

# GitHubBot: HOLD-Mechanismus für BACH-PRs
# Dieser Bot prüft BACH-PRs auf den module-gate-Status
# und setzt HOLD, wenn der Gate-Check nicht grün ist.
# Gilt auch für Draft-PRs (24-h-Draft-Freigabe).

on:
  pull_request:
    types: [opened, synchronize, ready_for_review]
  workflow_dispatch:

permissions:
  pull-requests: write
  contents: read

# Ein Lauf je PR: ein älterer PASS-Lauf darf Labels nicht mehr entfernen, die ein neuerer FAIL-Lauf gerade gesetzt hat.
concurrency:
  group: githubbot-hold-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  hold-check:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch PR base branch
        if: github.base_ref != ''
        run: git fetch origin ${{ github.base_ref }}

      - name: Prüfe module-gate Status
        id: check_gate
        run: |
          # Der module-gate-Workflow läuft auf einem eigenen Runner; sein
          # .gate_report.txt existiert in diesem Checkout nie. Deshalb führt
          # dieser Job dieselbe Prüfung selbst aus und wertet den Exit-Code aus.
          if python3 .github/workflows/module_gate_check.py; then
            GATE_STATUS="PASS"
          else
            GATE_STATUS="FAIL"
          fi
          echo "Gate-Status: $GATE_STATUS"
          echo "gate_status=$GATE_STATUS" >> "$GITHUB_OUTPUT"

      - name: Setze HOLD falls Gate nicht grün
        if: steps.check_gate.outputs.gate_status != 'PASS'
        run: |
          echo "Gate-Status ist nicht grün: ${{ steps.check_gate.outputs.gate_status }}"
          echo "Setze HOLD auf PR #${{ github.event.pull_request.number }}"
          
          # GitHub API aufrufen, um HOLD zu setzen
          curl -s -X POST \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/labels" \
            -d '{"labels": ["HOLD", "module-gate-fehler"]}'
          
          echo "HOLD-Label gesetzt."
          
          # Comment auf der PR hinzufügen
          curl -s -X POST \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/comments" \
            -d '{"body": "⚠️ **HOLD**: Der module-gate-Check ist nicht grün. Dieser PR kann nicht freigegeben werden, bis der Gate-Check bestanden ist. Bitte prüfe den Gate-Report und korrigiere die Modul-Grenzen."}'
          
          echo "HOLD-Comment hinzugefügt."

      - name: Entferne Gate-Labels falls Gate grün (nur Bot-eigene Holds)
        if: steps.check_gate.outputs.gate_status == 'PASS'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          echo "Gate-Status ist grün. Entferne nur Bot-eigene Gate-Labels; manuelle Holds bleiben erhalten."
          python3 .github/workflows/hold_ownership.py
