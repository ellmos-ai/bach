name: module-gate

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  module-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch PR base branch
        if: github.event_name == 'pull_request' && github.base_ref != ''
        run: git fetch origin ${{ github.base_ref }}

      - name: Modul-Gate-Prüfung
        run: python3 .github/workflows/module_gate_check.py
