name: module-gate

# Modul-Gate: Prüfung der Modularisierungskonformität
# Dieser Workflow wird als einziger Required Check auf main betrieben.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  module-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Modul-Gate-Prüfung
        id: gate
        run: |
          python3 .github/workflows/module_gate_check.py

      - name: Gate-Ergebnis prüfen
        if: steps.gate.outputs.gate_status == 'FAIL'
        run: |
          echo "Module-Gate-Prüfung fehlgeschlagen!"
          echo "${{ steps.gate.outputs.gate_report }}"
          exit 1

      - name: Gate-Erfolg melden
        if: steps.gate.outputs.gate_status == 'PASS'
        run: |
          echo "Module-Gate-Prüfung bestanden!"
          echo "${{ steps.gate.outputs.gate_report }}"