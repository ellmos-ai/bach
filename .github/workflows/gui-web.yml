name: GUI web

# Stillgelegt 2026-10-11: system/gui/web ist eine veraltete Kopie, einzige GUI-Quelle ist
# ellmos-system-gui (BACH bezieht das Release). Kein Auto-Trigger mehr; manuell startbar.
# Rollback: pull_request/push-Trigger mit den paths system/gui/web/** wieder eintragen.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dashboard:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: system/gui/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: system/gui/web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run build
