name: tests

# pytest fuer die Gedaechtnis-/Injektor-Pfade (S2/S3 von T-20260920-823767362),
# den Kern und (seit T-20260927-676283213) alle Testdateien, die im Inventar
# lokal ohne Live-Dienste gruen liefen. Laeuft ohne Live-DB und ohne
# Netzwerk-Dienste: conftest.py isoliert BACH_DB & Co. in ein Temp-Verzeichnis.
#
# Bewusst NICHT hier drin (Begruendung/Tickets siehe T-20260927-676283213):
# - system/tests/test_web_scrape_seam.py: offener Fehler
#   (T-20260927-606803060).
# - system/tests/test_idle_worker_parked.py: 18 Importfehler in der frischen
#   CI-Abhängigkeitsmenge, weil pystray dort nicht installiert ist.
# - system/tests/test_connectors_and_tray.py: neuer Tray-Ready-Test aus #146
#   importiert pystray; 1 Fehler in der frischen CI-Abhängigkeitsmenge.
# - test_abo_handler.py, test_bridge_tray.py, test_registry_watcher.py und
#   test_secrets_handler.py: lokal grün, aber im Ubuntu-CI-Lauf rot (PR #143).
# - system/tests/test_transfer_assistant_core_script.py: fest auf den
#   Mac-Studio-Live-Pfad codiert, kann in CI nie gruen sein (T-20260927-283375364).
# - system/tests/test_git_harvester.py: haengt real (>450s), Ursache offen
#   (T-20260927-375706252).
# - system/tests/seal_release_check.py (vormals test_seal.py): kein Unit-Test
#   (manuelles Release-Verifikationswerkzeug, braucht eine bereits befuellte
#   Release-DB), T-20260927-807838815.
# - system/tools/ollama/ollama_manual_check.py, system/hub/_services/claude_bridge/
#   telegram_manual_check.py (vormals test_tokens.py/telegram_test.py):
#   brauchen einen Live-Dienst und hatten keine echten asserts, matchen
#   pytests Discovery-Muster jetzt bewusst nicht mehr (T-20260927-283375364).
# - system/tests/test_accounts_via_accounts_core.py: privates accounts-core
#   ist in dieser CI ohne Token nicht installierbar (T-20260927-346884638).
# - system/tests/test_anonymizer_excel_dates.py und
#   test_report_workflow_service.py: openpyxl bzw. python-docx fehlen in
#   der CI-Installation (T-20260927-346884638).

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          # Volle Historie: tests/test_timebeat_parity.py laedt den Vor-E5-Stand
          # per 'git show' und wuerde in einem flachen Klon uebersprungen.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Abhaengigkeiten (ohne private ellmos-ai-Pakete)
        run: |
          # assistant-core, accounts-core und ellmos-chat sind private Repos und ohne Token
          # nicht installierbar; die ausgewaehlten Suiten brauchen sie nicht bzw. fallen weich zurueck.
          # doc-services (ellmos-ai/doc-services) ist seit 2026-09-26 public und
          # wird installiert, damit die Dokument-Extraktions-Seam-Tests real laufen.
          grep -v -E '^(assistant-core|accounts-core|ellmos-chat) @' requirements.txt > requirements-ci.txt
          python -m pip install --upgrade pip
          python -m pip install -r requirements-ci.txt pytest pytest-timeout "python-telegram-bot>=22,<23" "fastapi>=0.128.0" "starlette>=0.50.0" "httpx>=0.28.1" "uvicorn>=0.40.0"

      - name: "pytest (T-20260927-676283213: alle lokal ohne Live-Dienste gruenen Dateien)"
        env:
          PYTHONIOENCODING: utf-8
        run: |
          python -m pytest -q -rA -p no:cacheprovider --timeout=120 --timeout-method=thread \
            system/tests/test_activity_dashboard.py \
            system/tests/test_activity_tracker.py \
            system/tests/test_agent_launcher_handler.py \
