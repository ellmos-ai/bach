[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ellmos-bach"
version = "3.14.0"
description = "BACH root-level editable install shim"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
  {name = "BACH Contributors"},
]
dynamic = ["dependencies", "optional-dependencies"]

[project.scripts]
bach = "bach:main"

[project.entry-points."ellmos.report_clients"]
bach-control = "bach_report_client:create_report_control_client"

[tool.setuptools]
py-modules = ["bach", "bach_api", "bach_report_client"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}
