<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Neuronales Netz / Gehirn -->
  <!-- Linke Schicht: 2 Neuronen -->
  <circle cx="14" cy="22" r="4" stroke="#e2e4eb" stroke-width="2"/>
  <circle cx="14" cy="42" r="4" stroke="#e2e4eb" stroke-width="2"/>
  <!-- Mittlere Schicht: 3 Neuronen -->
  <circle cx="32" cy="14" r="4" stroke="#e2e4eb" stroke-width="2"/>
  <circle cx="32" cy="32" r="4" stroke="#e2e4eb" stroke-width="2"/>
  <circle cx="32" cy="50" r="4" stroke="#e2e4eb" stroke-width="2"/>
  <!-- Rechte Schicht: 2 Neuronen -->
  <circle cx="50" cy="22" r="4" stroke="#e2e4eb" stroke-width="2"/>
  <circle cx="50" cy="42" r="4" stroke="#e2e4eb" stroke-width="2"/>
  <!-- Verbindungen links → mitte -->
  <line x1="18" y1="22" x2="28" y2="14" stroke="#e2e4eb" stroke-width="1.5" opacity="0.7"/>
  <line x1="18" y1="22" x2="28" y2="32" stroke="#e2e4eb" stroke-width="1.5" opacity="0.7"/>
  <line x1="18" y1="22" x2="28" y2="50" stroke="#e2e4eb" stroke-width="1.5" opacity="0.7"/>
  <line x1="18" y1="42" x2="28" y2="14" stroke="#e2e4eb" stroke-width="1.5" opacity="0.7"/>
  <line x1="18" y1="42" x2="28" y2="32" stroke="#e2e4eb" stroke-width="1.5" opacity="0.7"/>
  <line x1="18" y1="42" x2="28" y2="50" stroke="#e2e4eb" stroke-width="1.5" opacity="0.7"/>
  <!-- Verbindungen mitte → rechts -->
  <line x1="36" y1="14" x2="46" y2="22" stroke="#e2e4eb" stroke-width="1.5" opacity="0.7"/>
  <line x1="36" y1="14" x2="46" y2="42" stroke="#e2e4eb" stroke-width="1.5" opacity="0.7"/>
  <line x1="36" y1="32" x2="46" y2="22" stroke="#e2e4eb" stroke-width="1.5" opacity="0.7"/>
  <line x1="36" y1="32" x2="46" y2="42" stroke="#e2e4eb" stroke-width="1.5" opacity="0.7"/>
  <line x1="36" y1="50" x2="46" y2="22" stroke="#e2e4eb" stroke-width="1.5" opacity="0.7"/>
  <line x1="36" y1="50" x2="46" y2="42" stroke="#e2e4eb" stroke-width="1.5" opacity="0.7"/>
</svg>
