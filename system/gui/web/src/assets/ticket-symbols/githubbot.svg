<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Bot head -->
  <rect x="14" y="18" width="36" height="28" rx="6" stroke="#e2e4eb" stroke-width="2"/>
  <!-- Eyes -->
  <circle cx="24" cy="30" r="4" stroke="#e2e4eb" stroke-width="2"/>
  <circle cx="40" cy="30" r="4" stroke="#e2e4eb" stroke-width="2"/>
  <!-- Eye pupils -->
  <circle cx="24" cy="30" r="1.5" fill="#e2e4eb"/>
  <circle cx="40" cy="30" r="1.5" fill="#e2e4eb"/>
  <!-- Mouth -->
  <path d="M24 38 Q32 43 40 38" stroke="#e2e4eb" stroke-width="2" stroke-linecap="round"/>
  <!-- Antenna -->
  <line x1="32" y1="18" x2="32" y2="10" stroke="#e2e4eb" stroke-width="2"/>
  <circle cx="32" cy="8" r="3" stroke="#e2e4eb" stroke-width="2"/>
  <!-- Ear/side connectors -->
  <rect x="8" y="26" width="6" height="8" rx="2" stroke="#e2e4eb" stroke-width="2"/>
  <rect x="50" y="26" width="6" height="8" rx="2" stroke="#e2e4eb" stroke-width="2"/>
  <!-- Bottom body stub -->
  <rect x="24" y="46" width="16" height="6" rx="2" stroke="#e2e4eb" stroke-width="2"/>
</svg>
