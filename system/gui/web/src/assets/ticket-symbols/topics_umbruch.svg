<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Weltkugel mit Kompass -->
  <!-- Globus-Kreis -->
  <circle cx="32" cy="32" r="22" stroke="#e2e4eb" stroke-width="2"/>
  <!-- Längengrade (vertikale Ellipsen) -->
  <ellipse cx="32" cy="32" rx="10" ry="22" stroke="#e2e4eb" stroke-width="1.5" opacity="0.6"/>
  <ellipse cx="32" cy="32" rx="22" ry="8" stroke="#e2e4eb" stroke-width="1.5" opacity="0.6"/>
  <!-- Horizontale Linie (Äquator) -->
  <line x1="10" y1="32" x2="54" y2="32" stroke="#e2e4eb" stroke-width="1.5" opacity="0.6"/>
  <!-- Kompass-Rose überlagert in der Mitte -->
  <line x1="32" y1="22" x2="32" y2="28" stroke="#e2e4eb" stroke-width="2" stroke-linecap="round"/>
  <line x1="32" y1="36" x2="32" y2="42" stroke="#e2e4eb" stroke-width="2" stroke-linecap="round"/>
  <line x1="22" y1="32" x2="28" y2="32" stroke="#e2e4eb" stroke-width="2" stroke-linecap="round"/>
  <line x1="36" y1="32" x2="42" y2="32" stroke="#e2e4eb" stroke-width="2" stroke-linecap="round"/>
  <!-- Nord-Pfeil -->
  <polygon points="32,20 30,27 34,27" fill="#e2e4eb"/>
</svg>
