<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BACH Dashboard</title>
    <script>!function(){var t=localStorage.getItem("bach-theme");t&&t!=="dark"&&document.documentElement.setAttribute("data-theme",t)}()</script>
    <link rel="stylesheet" href="/static/css/main.css?v=2">

    <!-- TailwindCSS via CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        'bach-primary': '#d4485a',
                        'bach-accent': '#5b8def',
                        'bach-success': '#4ade80',
                        'bach-warning': '#f5c542',
                        'bach-error': '#ef5350',
                    }
                }
            }
        }
    </script>

    <!-- Alpine.js via CDN -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>

    <style>
        .stat-box::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 3px;
            border-radius: 0 0 2px 2px;
            opacity: 0.6;
        }

        .stat-box.green::after { background: var(--success); }
        .stat-box.blue::after { background: var(--accent-blue); }
        .stat-box.orange::after { background: var(--warning); }
        .stat-box.accent::after { background: var(--accent); }

        .calc-result {
            background: linear-gradient(135deg, rgba(212, 72, 90, 0.08) 0%, rgba(91, 141, 239, 0.08) 100%);
        }

        /* Theme-Overrides: Tailwind-Klassen auf CSS-Variablen umleiten */

        /* Backgrounds */
        [data-theme] .bg-\[\#0b0d14\] { background-color: var(--bg-dark) !important; }
        [data-theme] .bg-\[\#111420\] { background-color: var(--bg-panel) !important; }
        [data-theme] .bg-\[\#171b28\] { background-color: var(--bg-card) !important; }
        [data-theme] .hover\:bg-\[\#111420\]:hover { background-color: var(--bg-panel) !important; }
        [data-theme] .hover\:bg-\[\#171b28\]:hover { background-color: var(--bg-card) !important; }

        /* Borders */
        [data-theme] .border-\[\#1e2236\] { border-color: var(--border) !important; }
        [data-theme] .border-\[\#2a3048\] { border-color: var(--border-hover) !important; }
        [data-theme] .border-b-2.border-\[\#1e2236\] { border-color: var(--border) !important; }
        [data-theme] .divide-\[\#2a3048\] > :not([hidden]) ~ :not([hidden]) { border-color: var(--border-hover) !important; }

        /* Text */
        [data-theme] .text-gray-200 { color: var(--text) !important; }
        [data-theme] .text-gray-400 { color: var(--text-muted) !important; }
        [data-theme] .text-gray-500 { color: var(--text-dim) !important; }

        /* Interactive */
        [data-theme] .focus\:border-bach-accent:focus { border-color: var(--accent) !important; }
        [data-theme] .hover\:border-bach-accent:hover { border-color: var(--accent) !important; }
    </style>
</head>

<body class="min-h-screen transition-colors duration-300"
style="background: var(--bg-dark); color: var(--text)">

    <header class="main-header" id="main-header"></header>

    <main class="container mx-auto px-4 py-6">
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <!-- Status Card -->
            <div class="bg-[#111420] border border-[#1e2236] rounded-xl p-6 shadow-lg">
                <h2 class="text-xl font-bold mb-4 text-gray-200">System Status</h2>
                <div class="grid grid-cols-3 gap-4">
                    <div class="text-center">
                        <span class="block text-3xl font-bold text-bach-primary" id="stat-tasks">-</span>
                        <span class="text-xs text-gray-400 uppercase tracking-wide">Offene Tasks</span>
                    </div>
                    <div class="text-center">
                        <span class="block text-3xl font-bold text-bach-accent" id="stat-messages">-</span>
                        <span class="text-xs text-gray-400 uppercase tracking-wide">Ungelesene</span>
                    </div>
                    <div class="text-center">
                        <span class="block text-3xl font-bold text-bach-warning" id="stat-deadlines">0</span>
                        <span class="text-xs text-gray-400 uppercase tracking-wide">Fristen</span>
                    </div>
                </div>
            </div>

            <!-- Aktive Agenten Card -->
            <div class="bg-[#111420] border border-[#1e2236] rounded-xl p-6 shadow-lg">
                <div class="flex justify-between items-center mb-4">
                    <h2 class="text-xl font-bold text-gray-200">Aktive Agenten</h2>
                    <a href="/agents" class="text-xs text-gray-400 hover:text-bach-accent transition-colors">Verwalten →</a>
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div class="text-center">
                        <span class="block text-3xl font-bold text-bach-success" id="stat-agents-active">-</span>
                        <span class="text-xs text-gray-400 uppercase tracking-wide">Aktiv</span>
                    </div>
                    <div class="text-center">
                        <span class="block text-3xl font-bold text-bach-accent" id="stat-agents-total">-</span>
                        <span class="text-xs text-gray-400 uppercase tracking-wide">Konfiguriert</span>
                    </div>
                </div>
            </div>

            <!-- Deadlines Card -->
            <div class="bg-[#111420] border border-bach-error rounded-xl p-6 shadow-lg hidden" id="deadlines-card">
                <h2 class="text-xl font-bold mb-4 text-bach-error">⚠️ Kritische Fristen</h2>
                <div id="deadlines-list" class="space-y-2"></div>
            </div>

            <!-- Favoriten & Quick Links -->
            <div class="bg-[#111420] border border-[#1e2236] rounded-xl p-6 shadow-lg">
                <div class="flex justify-between items-center mb-4">
                    <h2 class="text-xl font-bold text-gray-200">Favoriten & Tools</h2>
                    <button
                        onclick="toggleFavoritesEdit()"
                        id="edit-favs-btn"
                        class="px-3 py-1 text-sm bg-[#171b28] border border-[#1e2236] rounded-lg hover:border-bach-accent transition-all"
                    >
                        Bearbeiten
                    </button>
                </div>
                <div id="favorites-container" class="flex flex-wrap gap-2">
                    <!-- Wird dynamisch geladen -->
                </div>
                <div id="favorites-edit" class="hidden mt-4 pt-4 border-t border-[#1e2236]">
                    <p class="text-sm text-gray-400 mb-2">Verfuegbare Seiten:</p>
                    <div id="available-pages" class="flex flex-wrap gap-2"></div>
                </div>
            </div>

            <!-- Recent Tasks -->
            <div class="bg-[#111420] border border-[#1e2236] rounded-xl p-6 shadow-lg">
                <h2 class="text-xl font-bold mb-4 text-gray-200">Aktuelle Tasks</h2>
                <div id="tasks-list" class="space-y-2">
                    <p class="text-gray-400 text-center py-4">Lade...</p>
                </div>
            </div>

            <!-- Task Statistik / Scanner Monitor -->
            <div id="scanner-status" class="hidden bg-[#111420] border border-[#1e2236] rounded-xl p-6 shadow-lg"></div>
        </div>
    </main>

    <footer class="bg-[#111420] border-t border-[#1e2236] py-4 text-center">
        <span class="text-gray-500 text-xs tracking-wider font-medium">BACH Dashboard</span>
    </footer>

    <script src="/static/js/api.js?v=2"></script>
    <script src="/static/js/nav.js?v=4"></script>
    <script src="/static/js/app.js?v=2"></script>
    <script>
        const esc = escapeHtml;

        // Deadlines laden (Task #575)
        async function loadDeadlines() {
            try {
                const res = await fetch('/api/financial/deadlines');
                const data = await res.json();
                if (data.success && data.count > 0) {
                    document.getElementById('stat-deadlines').textContent = data.count;
                    document.getElementById('stat-deadlines').className = 'block text-3xl font-bold text-bach-error';
                    const card = document.getElementById('deadlines-card');
                    const list = document.getElementById('deadlines-list');
                    card.classList.remove('hidden');
                    list.innerHTML = data.deadlines.map(d => `
                        <div class="p-3 mb-2 bg-[#171b28] rounded-lg border-l-4 border-bach-error">
                            <div class="font-bold text-gray-200">${esc(d.name)}</div>
                            <div class="text-sm text-gray-400 mt-1">
                                Bis: ${new Date(d.deadline).toLocaleDateString()}
                            </div>
                        </div>
                    `).join('');
                }
            } catch (e) { console.error('Deadlines API Fehler:', e); }
        }

        window.addEventListener('DOMContentLoaded', () => {
            loadDeadlines();
        });
    </script>
</body>

</html>
