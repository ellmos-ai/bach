<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kontakte | System GUI</title>
    <script>!function(){var t=localStorage.getItem("bach-theme");t&&t!=="dark"&&document.documentElement.setAttribute("data-theme",t)}()</script>
    <link rel="stylesheet" href="/static/css/main.css?v=2">
    <style>
        .kontakte-content {
            padding: 1.5rem;
            max-width: 1400px;
            margin: 0 auto;
        }

        .page-title {
            margin: 0 0 0.5rem 0;
            font-size: 1.75rem;
        }

        .subtitle {
            color: var(--text-muted, #888);
            margin: 0 0 1.5rem 0;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 1rem;
            margin-bottom: 2rem;
        }

        .stat-card {
            background: var(--bg-card, #1e1e1e);
            border: 1px solid var(--border, #333);
            border-radius: 8px;
            padding: 1rem;
            text-align: center;
        }

        .stat-value {
            font-size: 1.75rem;
            font-weight: bold;
            color: var(--accent-blue);
        }

        .stat-label {
            color: var(--text-muted, #888);
            font-size: 0.8rem;
            margin-top: 0.25rem;
        }

        .actions {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 1.5rem;
            flex-wrap: wrap;
            align-items: center;
        }

        .search-box {
            flex: 1;
            min-width: 200px;
            padding: 0.5rem 1rem;
            border: 1px solid var(--border, #333);
            border-radius: 4px;
            background: var(--bg-card, #2a2a2a);
            color: var(--text, #fff);
        }

        .btn {
            padding: 0.5rem 1rem;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.9rem;
        }

        .btn-primary { background: var(--accent-blue); color: #000; }
        .btn-secondary { background: var(--border, #333); color: var(--text, #fff); }
        .btn-danger { background: var(--error); color: white; }
        .btn-sm { padding: 0.25rem 0.5rem; font-size: 0.8rem; }

        .section {
            background: var(--bg-card, #1e1e1e);
            border: 1px solid var(--border, #333);
            border-radius: 8px;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
        }

        .section h2 {
            margin-top: 0;
            border-bottom: 1px solid var(--border, #333);
            padding-bottom: 0.5rem;
            margin-bottom: 1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .actions select {
            padding: 0.5rem;
            border-radius: 4px;
            border: 1px solid var(--border, #333);
            background: var(--bg-card, #2a2a2a);
            color: var(--text, #fff);
        }

        .contact-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 1rem;
        }

        .contact-card {
            background: var(--bg-card, #171b28);
            color: var(--text, #e2ded8);
            border: 1px solid var(--border, #333);
            border-radius: 8px;
            padding: 1rem;
            transition: border-color 0.2s;
        }

        .contact-card:hover {
            border-color: var(--accent-blue);
        }

        .contact-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 0.75rem;
        }

        .contact-name {
            font-weight: 600;
            font-size: 1.1rem;
            margin: 0;
        }

        .contact-org {
            color: var(--text-muted, #888);
            font-size: 0.85rem;
        }

        .contact-details {
            font-size: 0.9rem;
            color: var(--text-muted, #888);
        }

        .contact-details .item {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            margin-bottom: 0.25rem;
        }

        .contact-details .icon {
            width: 16px;
            text-align: center;
        }

        .contact-tags {
            display: flex;
            gap: 0.25rem;
            flex-wrap: wrap;
            margin-top: 0.75rem;
        }

        .badge {
            display: inline-block;
            padding: 0.15rem 0.4rem;
            border-radius: 3px;
            font-size: 0.7rem;
            font-weight: 500;
        }

        .badge.category { background: var(--accent-blue); color: white; }
        .badge.tag { background: var(--text-muted); color: white; }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            z-index: 1200;
            align-items: center;
            justify-content: center;
        }

        .modal.active { display: flex; }

        .modal-content {
            background: var(--bg-card, #1e1e1e);
            border: 1px solid var(--border, #333);
            border-radius: 8px;
            padding: 2rem;
            max-width: 600px;
            width: 90%;
            max-height: 90vh;
            overflow-y: auto;
        }

        .modal-content h3 { margin-top: 0; }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
        }

        .form-group {
            margin-bottom: 1rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.25rem;
            font-weight: 500;
            font-size: 0.9rem;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 0.5rem;
            border: 1px solid var(--border, #333);
            border-radius: 4px;
            background: var(--bg-card, #2a2a2a);
            color: var(--text, #fff);
            font-size: 0.9rem;
        }

        .form-actions {
            display: flex;
            gap: 0.5rem;
            justify-content: flex-end;
            margin-top: 1.5rem;
        }

        .section-title {
            font-size: 0.85rem;
            color: var(--text-muted, #888);
            margin: 1rem 0 0.5rem 0;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .contacts-workspace {
            display: grid;
            grid-template-columns: minmax(270px, 360px) minmax(0, 1fr);
            gap: 1rem;
            min-height: 460px;
        }
        .contact-list-panel, .preview-panel {
            min-width: 0;
            background: var(--bg-card, #1e1e1e);
            border: 1px solid var(--border, #333);
            border-radius: 8px;
        }
        .contact-list-panel { overflow: hidden; }
        .contact-list-panel h2, .preview-header { margin: 0; padding: 1rem 1.25rem; border-bottom: 1px solid var(--border, #333); }
        .contact-list { max-height: min(68vh, 780px); overflow-y: auto; }
        .contact-row {
            display: block; width: 100%; padding: 0.9rem 1.25rem; text-align: left;
            background: transparent; color: var(--text, #fff); border: 0;
            border-bottom: 1px solid var(--border, #333); cursor: pointer;
        }
        .contact-row:hover, .contact-row[aria-pressed="true"] { background: var(--bg-hover, #27364b); }
        .contact-row[aria-pressed="true"] { box-shadow: inset 3px 0 var(--accent-blue, #68a8e8); }
        .contact-row-name { display: block; font-weight: 650; }
        .contact-row-meta { display: block; margin-top: 0.2rem; color: var(--text-muted, #aaa); font-size: 0.86rem; }
        .preview-panel { padding-bottom: 1.25rem; }
        .preview-header { display: flex; align-items: flex-start; justify-content: space-between; gap: 1rem; }
        .preview-header h2 { margin: 0; font-size: 1.35rem; }
        .preview-subtitle { margin: 0.3rem 0 0; color: var(--text-muted, #aaa); }
        .preview-actions { display: flex; flex-wrap: wrap; gap: 0.5rem; }
        .preview-body { padding: 1.25rem; }
        .preview-fields { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 1.1rem; margin: 0; }
        .preview-field { min-width: 0; overflow-wrap: anywhere; }
        .preview-field dt { color: var(--text-muted, #aaa); font-size: 0.82rem; margin-bottom: 0.2rem; }
        .preview-field dd { margin: 0; white-space: pre-wrap; }
        .preview-field.wide { grid-column: 1 / -1; }
        .preview-empty, .list-message { color: var(--text-muted, #aaa); padding: 1.25rem; margin: 0; }
        .preview-close { display: none; }
        .preview-backdrop { display: none; }
        .contact-row:focus-visible, .btn:focus-visible, .search-box:focus-visible,
        .actions select:focus-visible { outline: 2px solid var(--accent-blue, #68a8e8); outline-offset: 2px; }
        @media (max-width: 760px) {
            .contacts-workspace { display: block; }
            .contact-list { max-height: none; }
            .preview-panel {
                position: fixed; z-index: 1100; inset: auto 0 0; max-height: 88vh;
                overflow-y: auto; border-radius: 12px 12px 0 0; transform: translateY(105%);
                visibility: hidden; transition: transform 0.18s ease, visibility 0.18s ease;
            }
            .preview-panel.open { transform: translateY(0); visibility: visible; }
            .preview-backdrop.open { display: block; position: fixed; z-index: 1099; inset: 0; background: rgba(0,0,0,0.65); }
            .preview-close { display: inline-flex; }
            .preview-fields { grid-template-columns: 1fr; }
        }
        @media (prefers-reduced-motion: reduce) { .preview-panel { transition: none; } }
    </style>
</head>
<body>
    <header class="main-header" id="main-header"></header>

    <main class="kontakte-content">
        <h1 class="page-title">Kontakte</h1>
        <p class="subtitle">Kontakt auswählen, Details ansehen und bei Bedarf bearbeiten.</p>

        <!-- Stats -->
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-value" id="stat-total">-</div>
                <div class="stat-label">Kontakte</div>
            </div>
            <div class="stat-card"><div class="stat-value" id="stat-visible">-</div><div class="stat-label">In der Auswahl</div></div>
        </div>

        <!-- Actions -->
        <div class="actions">
            <input type="search" class="search-box" id="search-input" aria-label="Kontakte durchsuchen" placeholder="Name, Organisation oder E-Mail suchen">
            <select id="filter-category" aria-label="Kategorie filtern">
                <option value="">Alle Kategorien</option>
            </select>
            <button class="btn btn-primary" onclick="showAddContactModal()">+ Neuer Kontakt</button>
            <button class="btn btn-secondary" type="button" disabled title="Der Export muss vor der Freigabe an einen sicheren Download-Endpunkt gebunden werden.">Export (in Arbeit)</button>
        </div>

        <div class="contacts-workspace">
            <section class="contact-list-panel" aria-label="Kontaktliste">
                <h2>Kontaktliste</h2>
                <div class="contact-list" id="contacts-list" role="group" aria-label="Kontakte" aria-busy="true">
                    <p class="list-message">Kontakte werden geladen …</p>
                </div>
            </section>
            <div class="preview-backdrop" id="preview-backdrop"></div>
            <section class="preview-panel" id="contact-preview" aria-label="Kontaktvorschau" tabindex="-1">
                <div class="preview-header">
                    <div><h2 id="preview-title">Kontaktvorschau</h2><p class="preview-subtitle" id="preview-subtitle">Wählen Sie einen Kontakt aus der Liste.</p></div>
                    <div class="preview-actions">
                        <button type="button" class="btn btn-secondary btn-sm preview-close" id="preview-close">Schließen</button>
                        <button type="button" class="btn btn-primary btn-sm" id="preview-edit" disabled>Bearbeiten</button>
                        <button type="button" class="btn btn-danger btn-sm" id="preview-delete" disabled>Löschen</button>
                    </div>
                </div>
                <div class="preview-body" id="preview-body"><p class="preview-empty">Noch kein Kontakt ausgewählt.</p></div>
            </section>
        </div>
    </main>

    <!-- Modal: Kontakt hinzufügen/bearbeiten -->
    <div class="modal" id="contact-modal">
        <div class="modal-content">
            <h3 id="contact-modal-title">Neuer Kontakt</h3>
            <form id="contact-form" onsubmit="saveContact(event)">
                <input type="hidden" id="contact-edit-id">

                <div class="section-title">Grunddaten</div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Vorname</label>
                        <input type="text" id="contact-first-name" placeholder="Max">
                    </div>
                    <div class="form-group">
                        <label>Nachname *</label>
                        <input type="text" id="contact-last-name" required placeholder="Mustermann">
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Organisation</label>
                        <input type="text" id="contact-org" placeholder="Firma/Praxis">
                    </div>
                    <div class="form-group">
                        <label>Position/Titel</label>
                        <input type="text" id="contact-position" placeholder="Dr., Arzt, etc.">
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Kategorie</label>
                        <select id="contact-category">
                            <option value="Sonstiges">Sonstiges</option>
                            <option value="Gesundheit">Gesundheit</option>
                            <option value="Geschaeftlich">Geschäftlich</option>
                            <option value="Privat">Privat</option>
                            <option value="Familie">Familie</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Unterkategorie</label>
                        <input type="text" id="contact-subcategory" placeholder="z.B. Hausarzt, Zahnarzt">
                    </div>
                </div>

                <div class="section-title">Kontaktdaten</div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Telefon</label>
                        <input type="tel" id="contact-phone" placeholder="+49 123 456789">
                    </div>
                    <div class="form-group">
                        <label>Mobil</label>
                        <input type="tel" id="contact-mobile" placeholder="+49 170 1234567">
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>E-Mail</label>
                        <input type="email" id="contact-email" placeholder="email@example.com">
                    </div>
                    <div class="form-group">
                        <label>Website</label>
                        <input type="url" id="contact-website" placeholder="https://...">
                    </div>
                </div>

                <div class="section-title">Adresse</div>
                <div class="form-group">
                    <label>Straße</label>
                    <input type="text" id="contact-street" placeholder="Musterstr. 123">
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>PLZ</label>
                        <input type="text" id="contact-zip" placeholder="12345">
                    </div>
                    <div class="form-group">
                        <label>Stadt</label>
                        <input type="text" id="contact-city" placeholder="Musterstadt">
                    </div>
                </div>

                <div class="section-title">Sonstiges</div>
                <div class="form-group">
                    <label>Geburtstag</label>
                    <input type="date" id="contact-birthday">
                </div>
                <div class="form-group">
                    <label>Tags (kommasepariert)</label>
                    <input type="text" id="contact-tags" placeholder="wichtig, stammkunde">
                </div>
                <div class="form-group">
                    <label>Notizen</label>
                    <textarea id="contact-notes" rows="2" placeholder="Zusätzliche Informationen"></textarea>
                </div>

                <div class="form-actions">
                    <button type="button" class="btn btn-secondary" onclick="closeContactModal()">Abbrechen</button>
                    <button type="submit" class="btn btn-primary">Speichern</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        const API_BASE = '/api/contacts';
        let allContacts = [];
        let selectedContactId = null;
        const mobilePreview = window.matchMedia('(max-width: 760px)');

        function contactName(contact) {
            return String(contact.name || `${contact.first_name || ''} ${contact.last_name || ''}`.trim() || 'Ohne Namen');
        }

        function categoryLabel(value) {
            return value === 'Geschaeftlich' ? 'Geschäftlich' : value;
        }

        function contactId(contact) {
            const id = Number(contact.id);
            return Number.isSafeInteger(id) && id > 0 ? id : null;
        }

        function listMessage(message) {
            const list = document.getElementById('contacts-list');
            const p = document.createElement('p');
            p.className = 'list-message';
            p.textContent = message;
            list.replaceChildren(p);
        }

        function apiFetch(url, options = {}) {
            const headers = new Headers(options.headers || {});
            try {
                const token = localStorage.getItem('bach_device_token');
                if (token && !headers.has('Authorization')) headers.set('Authorization', `Bearer ${token}`);
            } catch (_) { /* Public reads still use the server's normal auth response. */ }
            return fetch(url, { ...options, headers });
        }

        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('search-input').addEventListener('input', filterContacts);
            document.getElementById('filter-category').addEventListener('change', filterContacts);
            document.getElementById('preview-close').addEventListener('click', closePreview);
            document.getElementById('preview-backdrop').addEventListener('click', closePreview);
            document.getElementById('preview-edit').addEventListener('click', () => {
                if (selectedContactId !== null) editContact(selectedContactId);
            });
            document.getElementById('preview-delete').addEventListener('click', () => {
                if (selectedContactId !== null) deleteContact(selectedContactId);
            });
            document.addEventListener('keydown', event => {
                if (event.key === 'Escape') {
                    if (document.getElementById('contact-modal').classList.contains('active')) closeContactModal();
                    else closePreview();
                }
            });
            loadContacts();
        });

        async function loadContacts() {
            const list = document.getElementById('contacts-list');
            list.setAttribute('aria-busy', 'true');
            listMessage('Kontakte werden geladen …');
            try {
                const res = await apiFetch(API_BASE);
                if (res.status === 401 || res.status === 403) throw new Error('auth_required');
                if (!res.ok) throw new Error('request_failed');
                const data = await res.json();
                if (!data.success || !Array.isArray(data.contacts)) throw new Error('response_failed');
                allContacts = data.contacts;
                document.getElementById('stat-total').textContent = String(allContacts.length);
                refreshCategories();
                filterContacts();
            } catch (e) {
                allContacts = [];
                selectedContactId = null;
                document.getElementById('stat-total').textContent = '—';
                document.getElementById('stat-visible').textContent = '—';
                listMessage(e.message === 'auth_required'
                    ? 'Für Kontakte ist eine Geräteanmeldung erforderlich.'
                    : 'Kontakte konnten nicht geladen werden. Prüfen Sie die Verbindung und versuchen Sie es erneut.');
                if (e.message === 'auth_required') {
                    const login = document.createElement('a');
                    login.href = '/token-dashboard';
                    login.textContent = 'Gerät anmelden';
                    document.getElementById('contacts-list').append(login);
                }
                renderPreview(null);
                closePreview();
            } finally {
                list.setAttribute('aria-busy', 'false');
            }
        }

        function refreshCategories() {
            const select = document.getElementById('filter-category');
            const current = select.value;
            select.replaceChildren(new Option('Alle Kategorien', ''));
            const categories = [...new Set(allContacts.map(c => String(c.category || '').trim()).filter(Boolean))]
                .sort((a, b) => a.localeCompare(b, 'de'));
            for (const category of categories) select.add(new Option(categoryLabel(category), category));
            select.value = categories.includes(current) ? current : '';
        }

        function filterContacts() {
            const search = document.getElementById('search-input').value.trim().toLocaleLowerCase('de');
            const category = document.getElementById('filter-category').value;
            const filtered = allContacts.filter(c => {
                const searchText = `${c.first_name || ''} ${c.last_name || ''} ${c.name || ''} ${c.organization || ''} ${c.email || ''}`.toLocaleLowerCase('de');
                return (!category || c.category === category) && searchText.includes(search);
            });
            renderContacts(filtered);
        }

        function renderContacts(contacts) {
            document.getElementById('stat-visible').textContent = String(contacts.length);
            const list = document.getElementById('contacts-list');
            if (!contacts.length) {
                selectedContactId = null;
                listMessage(allContacts.length ? 'Keine Treffer. Passen Sie Suche oder Kategorie an.' : 'Noch keine Kontakte vorhanden. Legen Sie einen neuen Kontakt an.');
                renderPreview(null);
                closePreview();
                return;
            }
            if (!contacts.some(c => contactId(c) === selectedContactId)) selectedContactId = contactId(contacts[0]);
            const rows = contacts.map(c => {
                const row = document.createElement('button');
                row.type = 'button';
                row.className = 'contact-row';
                row.setAttribute('aria-pressed', String(contactId(c) === selectedContactId));
                const name = document.createElement('span');
                name.className = 'contact-row-name';
                name.textContent = contactName(c);
                const meta = document.createElement('span');
                meta.className = 'contact-row-meta';
                meta.textContent = [c.organization, categoryLabel(c.category)].filter(Boolean).join(' · ') || 'Kontakt';
                row.append(name, meta);
                row.addEventListener('click', () => {
                    selectedContactId = contactId(c);
                    for (const item of list.querySelectorAll('.contact-row')) item.setAttribute('aria-pressed', String(item === row));
                    renderPreview(c);
                    if (mobilePreview.matches) openPreview();
                });
                return row;
            });
            list.replaceChildren(...rows);
            renderPreview(contacts.find(c => contactId(c) === selectedContactId) || null);
        }

        function previewField(list, label, value, wide = false) {
            if (value === null || value === undefined || String(value).trim() === '') return;
            const wrap = document.createElement('div');
            wrap.className = wide ? 'preview-field wide' : 'preview-field';
            const term = document.createElement('dt');
            term.textContent = label;
            const detail = document.createElement('dd');
            detail.textContent = String(value);
            wrap.append(term, detail);
            list.append(wrap);
        }

        function renderPreview(c) {
            document.getElementById('preview-title').textContent = c ? contactName(c) : 'Kontaktvorschau';
            document.getElementById('preview-subtitle').textContent = c
                ? [c.position, c.organization, categoryLabel(c.category)].filter(Boolean).join(' · ')
                : 'Wählen Sie einen Kontakt aus der Liste.';
            document.getElementById('preview-edit').disabled = !c || contactId(c) === null;
            document.getElementById('preview-delete').disabled = !c || contactId(c) === null;
            const body = document.getElementById('preview-body');
            if (!c) {
                const empty = document.createElement('p');
                empty.className = 'preview-empty';
                empty.textContent = 'Noch kein Kontakt ausgewählt.';
                body.replaceChildren(empty);
                return;
            }
            const fields = document.createElement('dl');
            fields.className = 'preview-fields';
            previewField(fields, 'Vorname', c.first_name);
            previewField(fields, 'Nachname', c.last_name);
            previewField(fields, 'Telefon', c.phone);
            previewField(fields, 'Mobil', c.phone_mobile);
            previewField(fields, 'E-Mail', c.email);
            previewField(fields, 'Website', c.website);
            previewField(fields, 'Unterkategorie', c.subcategory);
            previewField(fields, 'Geburtstag', c.birthday);
            previewField(fields, 'Adresse', [c.street, c.zip_code, c.city].filter(Boolean).join(', '), true);
            previewField(fields, 'Tags', c.tags, true);
            previewField(fields, 'Notizen', c.notes, true);
            if (!fields.children.length) {
                const empty = document.createElement('p');
                empty.className = 'preview-empty';
                empty.textContent = 'Für diesen Kontakt sind noch keine weiteren Angaben hinterlegt.';
                body.replaceChildren(empty);
            } else body.replaceChildren(fields);
        }

        function openPreview() {
            const preview = document.getElementById('contact-preview');
            preview.classList.add('open');
            preview.setAttribute('role', 'dialog');
            preview.setAttribute('aria-modal', 'true');
            document.getElementById('preview-backdrop').classList.add('open');
            document.getElementById('preview-close').focus();
        }

        function closePreview() {
            const preview = document.getElementById('contact-preview');
            const wasOpen = preview.classList.contains('open');
            preview.classList.remove('open');
            preview.removeAttribute('role');
            preview.removeAttribute('aria-modal');
            document.getElementById('preview-backdrop').classList.remove('open');
            if (wasOpen) {
                const selected = document.querySelector('.contact-row[aria-pressed="true"]');
                if (selected) selected.focus();
            }
        }

        function showAddContactModal() {
            document.getElementById('contact-modal-title').textContent = 'Neuer Kontakt';
            document.getElementById('contact-form').reset();
            document.getElementById('contact-edit-id').value = '';
            document.getElementById('contact-modal').classList.add('active');
            document.getElementById('contact-first-name').focus();
        }

        function closeContactModal() {
            document.getElementById('contact-modal').classList.remove('active');
        }

        async function editContact(id) {
            try {
                const res = await apiFetch(`${API_BASE}/${id}`);
                if (!res.ok) throw new Error('request_failed');
                const data = await res.json();
                const c = data.contact;
                if (!data.success || !c) throw new Error('response_failed');

                document.getElementById('contact-modal-title').textContent = 'Kontakt bearbeiten';
                document.getElementById('contact-edit-id').value = id;
                document.getElementById('contact-first-name').value = c.first_name || '';
                document.getElementById('contact-last-name').value = c.last_name || c.name || '';
                document.getElementById('contact-org').value = c.organization || '';
                document.getElementById('contact-position').value = c.position || '';
                document.getElementById('contact-category').value = c.category || 'Sonstiges';
                document.getElementById('contact-subcategory').value = c.subcategory || '';
                document.getElementById('contact-phone').value = c.phone || '';
                document.getElementById('contact-mobile').value = c.phone_mobile || '';
                document.getElementById('contact-email').value = c.email || '';
                document.getElementById('contact-website').value = c.website || '';
                document.getElementById('contact-street').value = c.street || '';
                document.getElementById('contact-zip').value = c.zip_code || '';
                document.getElementById('contact-city').value = c.city || '';
                document.getElementById('contact-birthday').value = c.birthday || '';
                document.getElementById('contact-tags').value = c.tags || '';
                document.getElementById('contact-notes').value = c.notes || '';

                closePreview();
                document.getElementById('contact-modal').classList.add('active');
                document.getElementById('contact-first-name').focus();
            } catch (e) { alert('Kontakt konnte nicht zum Bearbeiten geladen werden.'); }
        }

        async function saveContact(event) {
            event.preventDefault();
            const id = document.getElementById('contact-edit-id').value;

            const firstName = document.getElementById('contact-first-name').value;
            const lastName = document.getElementById('contact-last-name').value;

            const data = {
                first_name: firstName,
                last_name: lastName,
                name: `${firstName} ${lastName}`.trim(),
                organization: document.getElementById('contact-org').value,
                position: document.getElementById('contact-position').value,
                category: document.getElementById('contact-category').value,
                subcategory: document.getElementById('contact-subcategory').value,
                phone: document.getElementById('contact-phone').value,
                phone_mobile: document.getElementById('contact-mobile').value,
                email: document.getElementById('contact-email').value,
                website: document.getElementById('contact-website').value,
                street: document.getElementById('contact-street').value,
                zip_code: document.getElementById('contact-zip').value,
                city: document.getElementById('contact-city').value,
                birthday: document.getElementById('contact-birthday').value || null,
                tags: document.getElementById('contact-tags').value,
                notes: document.getElementById('contact-notes').value
            };

            try {
                const url = id ? `${API_BASE}/${id}` : API_BASE;
                const method = id ? 'PUT' : 'POST';
                const res = await apiFetch(url, {
                    method: method,
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });
                const result = await res.json();
                if (!res.ok || !result.success) throw new Error('save_failed');
                if (!id && Number.isSafeInteger(Number(result.id))) selectedContactId = Number(result.id);
                if (result.success) {
                    closeContactModal();
                    await loadContacts();
                }
            } catch (e) { alert('Kontakt konnte nicht gespeichert werden. Prüfen Sie die Anmeldung und versuchen Sie es erneut.'); }
        }

        async function deleteContact(id) {
            if (!confirm('Kontakt wirklich löschen?')) return;
            try {
                const res = await apiFetch(`${API_BASE}/${id}`, { method: 'DELETE' });
                if (!res.ok || !(await res.json()).success) throw new Error('delete_failed');
                closePreview();
                await loadContacts();
            } catch (e) { alert('Kontakt konnte nicht gelöscht werden.'); }
        }

    </script>

    <script src="/static/js/nav.js?v=4"></script>
</body>
